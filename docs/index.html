<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F1F4F2">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Tennis-Comeback 28.12.</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: one narrow column (760px), sticky header, day strip, session cards; bottom nav on phones, header tabs on desktop. */
:root{
  --bg:#F1F4F2; --surface:#FFFFFF; --surface-2:#E7EDE9; --ink:#15201A; --muted:#56655C; --line:#D3DDD7;
  --accent:#23664A; --accent-ink:#FFFFFF; --accent-soft:#DAEADF;
  --ball:#D5EC4A; --ball-ink:#1C2808;
  --ok:#23664A; --warn:#9A6411; --warn-soft:#F8ECD5; --bad:#B23A2C; --bad-soft:#F7E0DC;
  --shadow:0 1px 2px rgba(21,32,26,.06),0 4px 14px rgba(21,32,26,.05);
  --good:#22A05A; --c-core:#23826B; --c-gym:#3A5DBF; --c-lauf:#B4560F; --c-ath:#8646B4; --c-tennis:#C9E23A; --c-mob:#8E9C94; --c-on:#FFFFFF;
  --f-display:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:16px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1411; --surface:#161F1A; --surface-2:#1F2A24; --ink:#E5EDE8; --muted:#9DAEA4; --line:#2A3830;
  --accent:#6FC89C; --accent-ink:#0B1A12; --accent-soft:#1C3328;
  --ball:#D5EC4A; --ball-ink:#1C2808;
  --ok:#6FC89C; --warn:#E5B45A; --warn-soft:#3A2E17; --bad:#F08C7F; --bad-soft:#3C201C;
  --good:#5FD38A; --c-core:#4FC4A3; --c-gym:#86A3F2; --c-lauf:#F09A55; --c-ath:#C695EA; --c-tennis:#D5EC4A; --c-mob:#7D8C84; --c-on:#0E1411;
  --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E1411; --surface:#161F1A; --surface-2:#1F2A24; --ink:#E5EDE8; --muted:#9DAEA4; --line:#2A3830;
  --accent:#6FC89C; --accent-ink:#0B1A12; --accent-soft:#1C3328;
  --ball:#D5EC4A; --ball-ink:#1C2808;
  --ok:#6FC89C; --warn:#E5B45A; --warn-soft:#3A2E17; --bad:#F08C7F; --bad-soft:#3C201C;
  --good:#5FD38A; --c-core:#4FC4A3; --c-gym:#86A3F2; --c-lauf:#F09A55; --c-ath:#C695EA; --c-tennis:#D5EC4A; --c-mob:#7D8C84; --c-on:#0E1411;
  --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:8px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.ballmark{width:30px;height:30px;border-radius:50%;background:var(--ball);flex:none;position:relative;overflow:hidden}
.ballmark::before,.ballmark::after{content:"";position:absolute;width:30px;height:30px;border:2.5px solid var(--ball-ink);border-radius:50%;opacity:.55}
.ballmark::before{left:-19px;top:0}.ballmark::after{right:-19px;top:0}
.bt{font-family:var(--f-display);font-weight:800;font-size:18px;line-height:1.1}
.bs{font-size:13px;color:var(--muted)}
.sync{font-size:12px;color:var(--muted);white-space:nowrap;display:flex;align-items:center;gap:6px}
.sync::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync[data-s="saved"]::before{background:var(--ok)}
.sync[data-s="saving"]::before{background:var(--warn)}
.sync[data-s="error"]::before{background:var(--bad)}
.tabs{display:none;gap:4px}
.tabs a,.bnav a{text-decoration:none;color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.tabs a{padding:8px 12px;border-radius:10px}
.tabs a[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tabs a:hover{color:var(--ink)}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.bnav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);
  display:grid;grid-template-columns:repeat(4,1fr)}
.bnav a{flex-direction:column;gap:2px;font-size:12px;min-height:58px;justify-content:center}
.bnav a[aria-current="page"]{color:var(--accent)}
main{padding-block:18px 110px;display:flex;flex-direction:column;gap:16px}
@media (min-width:720px){.tabs{display:flex}.bnav{display:none}main{padding-block:24px 64px}}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:16px}
.muted{color:var(--muted)}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface-2);color:var(--ink)}
.chip.today{background:var(--ball);color:var(--ball-ink)}
.chip.ok{background:var(--accent-soft);color:var(--ok)}
.chip.no{background:var(--bad-soft);color:var(--bad)}
.note{border-radius:12px;padding:12px 14px;font-size:14px;background:var(--surface-2)}
.note.warn{background:var(--warn-soft)}
.note b{font-weight:700}

/* strip */
.strip{display:grid;grid-template-columns:40px repeat(7,minmax(0,1fr)) 40px;gap:4px;align-items:stretch}
.arrow{border:0;background:transparent;border-radius:10px;display:grid;place-items:center;color:var(--muted);min-height:58px}
.arrow:hover:not(:disabled){background:var(--surface-2);color:var(--ink)}
.arrow:disabled{opacity:.3;cursor:default}
.dbtn{border:1px solid transparent;background:transparent;border-radius:12px;min-height:58px;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
.dbtn .w{font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.dbtn .n{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.1}
.dbtn .dot{width:6px;height:6px;border-radius:50%;background:transparent}
.dbtn[data-st="ja"] .dot{background:var(--ok)}
.dbtn[data-st="nein"] .dot{background:var(--bad)}
.dbtn:hover:not(:disabled){background:var(--surface)}
.dbtn.is-today .n{text-decoration:underline;text-decoration-color:var(--ball);text-decoration-thickness:4px;text-underline-offset:3px}
.dbtn[aria-current="date"]{background:var(--surface);border-color:var(--line);box-shadow:var(--shadow)}
.dbtn:disabled{opacity:.35;cursor:default}

/* day head */
.dhead{display:flex;flex-direction:column;gap:6px}
.dhead h1{font-size:clamp(26px,6vw,34px);font-weight:800;line-height:1.1}
.dmeta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.wk{font-size:14px;color:var(--muted)}

/* status card */
.status{display:flex;flex-direction:column;gap:14px}
.qrow{display:flex;flex-direction:column;gap:8px}
.qlab{font-weight:600;font-size:15px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.yn button{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;font-size:16px;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s}
.yn button:hover{border-color:var(--muted)}
.yn button[aria-pressed="true"][data-v="ja"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.yn button[aria-pressed="true"][data-v="nein"]{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.pain{display:grid;grid-template-columns:repeat(11,minmax(0,1fr));gap:4px}
.pain button{min-height:40px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;padding:0;font-variant-numeric:tabular-nums}
.pain button[data-z="g"]{border-bottom:3px solid var(--ok)}
.pain button[data-z="y"]{border-bottom:3px solid var(--warn)}
.pain button[data-z="r"]{border-bottom:3px solid var(--bad)}
.pain button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.painhint{font-size:13px;color:var(--muted)}
.painhint.r{color:var(--bad);font-weight:600}

/* blocks */
.block{padding:4px 16px 6px}
.bh{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:14px 0 10px;flex-wrap:wrap}
.bh h2{font-size:19px;font-weight:700}
.bh .bsub{font-size:13px;color:var(--muted)}
.bprog{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.ex{display:grid;grid-template-columns:44px minmax(0,1fr);gap:10px;padding:12px 0;border-top:1px solid var(--line)}
.chk{width:44px;height:44px;border:0;background:transparent;display:grid;place-items:center;padding:0;border-radius:50%}
.chk span{width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;transition:background .15s,border-color .15s}
.chk svg{width:18px;height:18px;stroke:var(--accent-ink);stroke-width:3;fill:none;opacity:0;transition:opacity .15s}
.chk:hover span{border-color:var(--muted)}
.ex.is-done .chk span{background:var(--accent);border-color:var(--accent)}
.ex.is-done .chk svg{opacity:1}
.exb{min-width:0;display:flex;flex-direction:column;gap:6px;padding-top:9px}
.exh{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.exn{font-weight:600}
.exp{font-size:14px;color:var(--accent);font-weight:600;font-variant-numeric:tabular-nums}
.ex.is-done .exn{color:var(--muted)}
.cue{margin:0;font-size:14px;color:var(--muted);line-height:1.45}
.sets{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.set{display:flex;align-items:center;gap:4px;background:var(--surface-2);border-radius:10px;padding:4px 8px 4px 6px}
.set .sn{font-size:11px;font-weight:700;color:var(--muted);width:16px;text-align:center}
.set input,.mins input{width:3.4em;min-height:36px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px 6px;text-align:center;font-size:16px;font-variant-numeric:tabular-nums}
.set input:focus,.mins input:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
.set .u{font-size:12px;color:var(--muted)}
.setctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.sbtn{min-height:36px;padding:4px 12px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:13px}
.sbtn:hover:not(:disabled){border-color:var(--muted)}
.sbtn:disabled{opacity:.4;cursor:default}
.ilist{list-style:none;margin:0;padding:0 0 8px;display:flex;flex-direction:column}
.ilist li{padding:10px 0;border-top:1px solid var(--line)}
.ilist .cue{margin-top:2px}
.block.info{box-shadow:none;background:transparent}
.set input::placeholder,.mins input::placeholder{color:var(--muted);opacity:.55}
.mins{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.lastrow{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:13px;color:var(--muted)}
.linkbtn{border:0;background:transparent;color:var(--accent);font-weight:600;font-size:13px;padding:6px 4px;min-height:32px;border-radius:6px}
.linkbtn:hover{text-decoration:underline}
textarea{width:100%;min-height:76px;border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;resize:vertical}
textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 2px var(--accent-soft)}
label.tl{font-weight:600;font-size:15px;display:block;margin-bottom:6px}

/* plan */
.wkcard{padding:6px 16px 10px}
.wkh{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:12px 0 6px;flex-wrap:wrap}
.wkh h2{font-size:20px}
.wkgoal{font-size:14px;color:var(--muted);margin:0 0 6px}
.prow{display:grid;grid-template-columns:76px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;border:0;border-top:1px solid var(--line);background:transparent;text-align:left;padding:11px 0;min-height:48px}
.prow:hover .pl{color:var(--accent)}
.pd{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.pd b{color:var(--ink);font-weight:700}
.pl{font-weight:600;min-width:0}
.prow.is-today .pd b{text-decoration:underline;text-decoration-color:var(--ball);text-decoration-thickness:3px;text-underline-offset:3px}

/* progress */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tile{padding:14px}
.tile .v{font-family:var(--f-display);font-weight:800;font-size:clamp(24px,6vw,32px);line-height:1.1;font-variant-numeric:tabular-nums}
.tile .l{font-size:13px;color:var(--muted)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .h{font-size:11px;font-weight:700;color:var(--muted);text-align:center;text-transform:uppercase}
.cc{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:13px;font-weight:600;padding:0;gap:0;font-variant-numeric:tabular-nums;position:relative}
.cc small{font-size:11px;line-height:1;font-weight:700}
.cc[data-st="ja"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.cc[data-st="nein"]{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
.cc.future{color:var(--muted);background:transparent;border-style:dashed}
.cc.is-today{box-shadow:0 0 0 3px var(--ball)}
.cc .pf{position:absolute;top:3px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--warn)}
.cc .pf.r{background:var(--bad)}
.cc.goal{background:var(--ball);color:var(--ball-ink);border-color:var(--ball)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.chartbox{overflow-x:auto}
.chart{width:100%;height:auto;display:block;min-width:300px}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .ax{fill:var(--muted);font-size:11px;font-family:var(--f-body)}
.chart .ln{fill:none;stroke:var(--accent);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round}
.chart .ar{fill:var(--accent);opacity:.10}
.chart .pt{fill:var(--surface);stroke:var(--accent);stroke-width:2}
.chart .pt.end{fill:var(--accent)}
.chart .lbl{fill:var(--ink);font-size:12px;font-weight:700;font-family:var(--f-body)}
.chart .bar{fill:var(--accent);opacity:.35}.chart .bar.cur{opacity:1}
.ftabs{display:flex;flex-wrap:wrap;gap:6px}
.ftab{min-height:36px;padding:4px 12px;border-radius:999px;border:1px dashed var(--line);background:var(--surface);font-size:13px;font-weight:600;color:var(--muted)}
.ftab.has{border-style:solid;color:var(--ink)}
.ftab[aria-pressed="true"]{background:var(--ink);color:var(--bg);border:1px solid var(--ink)}
.fhead{display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}.fhead b{font-family:var(--f-display);font-size:17px}.fhead .muted{font-size:13px}
.fxlist{display:flex;flex-direction:column;gap:12px}
.fx{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.fxh{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}.fxh .muted{font-size:13px}
.fxs{font-size:14px;color:var(--muted)}.fxs b{color:var(--ink)}
.fx details summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--accent);min-height:32px;display:flex;align-items:center}
.chart .lim{stroke:var(--bad);stroke-width:1.5;stroke-dasharray:5 4}
.chart .liml{fill:var(--bad);font-size:11px;font-weight:600;font-family:var(--f-body)}
select{min-height:44px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:6px 10px;max-width:100%;font-size:16px}
.hist{width:100%;border-collapse:collapse;font-size:14px;font-variant-numeric:tabular-nums}
.hist td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
.hist td:first-child{color:var(--muted);width:110px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}
.sec{display:flex;flex-direction:column;gap:10px}
.sec h2{font-size:19px}

/* rules */
.rules h2{font-size:19px;margin-bottom:8px}
.rules ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.rules li{line-height:1.5}
.rules p{margin:0 0 8px}
.rules.alert{border-color:var(--bad)}
.rules.alert h2{color:var(--bad)}
@media (max-width:420px){.tiles{grid-template-columns:1fr 1fr}.tiles .tile:last-child{grid-column:span 2}.strip{grid-template-columns:30px repeat(7,minmax(0,1fr)) 30px;gap:2px}}

/* Tagesansicht-Layout */
.dayview{display:flex;flex-direction:column;gap:16px}
.daycol{display:flex;flex-direction:column;gap:16px;min-width:0}
@media (min-width:1000px){main.wide{max-width:1180px}.dayview{display:grid;grid-template-columns:440px minmax(0,1fr);gap:24px;align-items:start}
  .calwrap{position:sticky;top:calc(env(safe-area-inset-top,0px) + 76px)}}
/* Kalender nach Wochen */
.calcard{display:flex;flex-direction:column;gap:14px}
.calh{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.calh h2{font-size:19px}.calh .muted{font-size:13px}
.cbar{height:8px;border-radius:999px;background:var(--surface-2);overflow:hidden}
.cbar i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .4s ease}
.wblock{display:flex;flex-direction:column;gap:6px}
.wlab{font-size:13px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.wlab b{font-family:var(--f-display);font-weight:700;font-size:14px}
.wlab span{color:var(--muted)}
.wrow{display:grid;gap:4px}
.cd{position:relative;min-height:56px;border-radius:10px;border:1.5px solid var(--line);background:var(--surface);
  padding:5px 2px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-width:0;transition:border-color .2s,transform .12s}
.cd:hover{transform:translateY(-1px);border-color:var(--muted)}
.cd .wd{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.cd .dn{font-weight:600;font-size:12px;line-height:1.2;font-variant-numeric:tabular-nums}
.cd .mk{font-size:12px;font-weight:800;line-height:1;height:12px}
.cd.st-ok{border:2.5px solid var(--good)}
.cd.st-ok .mk{color:var(--good)}
.cd.st-miss{border:2.5px solid var(--bad)}
.cd.st-miss .mk{color:var(--bad)}
.cd.st-rest{opacity:.7}
.cd.is-today .wd{color:var(--ink);font-size:11px;font-weight:800}
.cd.is-today .dn{font-weight:800}
.cd.sel{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}

/* ---------- Kalender ---------- */
const WD=['So','Mo','Di','Mi','Do','Fr','Sa'];
const WDL=['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
const MON=['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const pad=n=>String(n).padStart(2,'0');
const keyOf=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const dateOf=k=>{const[y,m,d]=k.split('-').map(Number);return new Date(y,m-1,d)};
const short=k=>{const d=dateOf(k);return WD[d.getDay()]+' '+d.getDate()+'.'+(d.getMonth()+1)+'.'};
const DAYS=[];const DMAP={};
(function(){const d=new Date(2026,10,22);WEEKS.forEach((w,wi)=>w.days.forEach(([label,blocks,note])=>{
  const k=keyOf(d);const day={key:k,idx:DAYS.length,week:wi+1,label,blocks,note:note||''};
  // Eindeutige Schlüssel pro Tag (gleiche Übung zweimal an einem Tag)
  const seen={};day.items=blocks.map(b=>B[b].i.map(([id,p,tg])=>{seen[id]=(seen[id]||0)+1;return{k:seen[id]>1?id+'~'+seen[id]:id,id,p,tg:tg||null,cue:tg&&tg.cue}}));
  DAYS.push(day);DMAP[k]=day;d.setDate(d.getDate()+1)}))})();
const FIRST=DAYS[0].key, LAST=DAYS[DAYS.length-1].key;
const todayKey=()=>keyOf(new Date());
function defaultDay(){const t=todayKey();return t<FIRST?FIRST:(t>LAST?LAST:t)}
const baseId=k=>k.split('~')[0];
const isWorkout=day=>day.blocks.some(b=>!B[b].info);
const setsCount=it=>{if(it.tg&&it.tg.r)return it.tg.r.length;if(it.tg&&Array.isArray(it.tg.s))return it.tg.s.length;const m=/^(\d+)\s*×/.exec(it.p);return m?+m[1]:1};

const FIELDS={w:[['kg','kg ×'],['r','Wdh']],h:[['r','Wdh ×'],['s','s']],t:[['s','s gehalten']],r:[['r','Wdh']]};

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- Speicher ---------- */
const LS='comeback-2812-logs-v1';
let LOGS={};
try{LOGS=JSON.parse(localStorage.getItem(LS)||'{}')||{}}catch(e){LOGS={}}
function cacheLocal(){try{localStorage.setItem(LS,JSON.stringify(LOGS))}catch(e){}}
function getLog(k){return LOGS[k]||{status:null,pain:null,note:'',ex:{}}}
function ensureLog(k){if(!LOGS[k])LOGS[k]={status:null,pain:null,note:'',ex:{}};if(!LOGS[k].ex)LOGS[k].ex={};return LOGS[k]}
let MODE='local', COL=null, deferRender=false;
const syncEl=document.getElementById('sync');
function setSync(s){const t={loading:'Lädt…',saving:'Speichert…',saved:'Gespeichert',local:'Nur auf diesem Gerät',error:'Nicht gespeichert',offline:'Keine Verbindung'}[s];syncEl.dataset.s=s;syncEl.textContent=t;
  syncEl.title=s==='local'?'Einträge bleiben nur in diesem Browser.':(s==='error'?'Speichern fehlgeschlagen. Die nächste Änderung versucht es erneut.':'')}
const pending=new Set();let writing=false,wtimer=null;
function touch(k){const l=ensureLog(k);l.updated=Date.now();cacheLocal();if(MODE!=='db'){return}pending.add(k);setSync('saving');clearTimeout(wtimer);wtimer=setTimeout(flush,700)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function writeDoc(k){const data=JSON.parse(JSON.stringify(LOGS[k]));try{await COL.doc('d-'+k).set(data)}catch(e){if(e&&e.code==='unavailable'){await sleep(700+Math.random()*900);await COL.doc('d-'+k).set(data)}else throw e}}
async function flush(){if(writing)return;writing=true;try{while(pending.size){const k=pending.values().next().value;pending.delete(k);try{await writeDoc(k)}catch(e){pending.add(k);setSync(e&&e.code==='quota_exceeded'?'error':'error');return}}setSync('saved')}finally{writing=false;if(pending.size&&syncEl.dataset.s!=='error'){clearTimeout(wtimer);wtimer=setTimeout(flush,700)}}}

async function initDb(){
  let tries=0;while(!(window.claude&&window.claude.use)&&tries<20){await sleep(100);tries++}
  if(!(window.claude&&window.claude.use)){setSync('local');return}
  try{
    const [db,user]=await Promise.all([window.claude.use('db'),window.claude.use('user')]);
    const uid=user?await user.id():null;
    if(!db||!uid){setSync('local');return}
    COL=db.collection('data/users/'+uid);MODE='db';
    let first=true;const to=setTimeout(()=>{if(first)setSync('offline')},10000);
    COL.onSnapshot(snap=>{
      const remote={};
      snap.docs.forEach(doc=>{if(!doc.exists)return;const k=doc.id.slice(2);const d=doc.data();remote[k]=d;
        if(pending.has(k))return;const loc=LOGS[k];
        if(!loc||(d.updated||0)>=(loc.updated||0))LOGS[k]=JSON.parse(JSON.stringify(d))});
      if(first&&!snap.metadata.fromCache){first=false;clearTimeout(to);
        Object.keys(LOGS).forEach(k=>{if(DMAP[k]&&(!remote[k]||(LOGS[k].updated||0)>(remote[k].updated||0)))pending.add(k)});
        if(pending.size){setSync('saving');flush()}else if(!writing)setSync('saved')}
      cacheLocal();safeRender();
    },err=>{clearTimeout(to);MODE='local';setSync('local')});
  }catch(e){setSync('local')}
}

/* ---------- Auswertung ---------- */
function exDone(e,lg){if(!lg)return false;if(typeof lg.done==='boolean')return lg.done;
  if(e.t==='m')return (numv(lg.min)||0)>0;if(hasSets(e.t))return (lg.sets||[]).some(s=>s&&numv(s[mainF(e.t)])>0);return false}
const setFilled=x=>x&&(numv(x.r)!=null||numv(x.kg)!=null||numv(x.s)!=null);
function setTxt(t,s){const r=numv(s.r),kg=numv(s.kg),sec=numv(s.s);
  if(t==='h')return (r!=null?r:'?')+' × '+(sec!=null?sec:'?')+' s';
  if(t==='t')return (sec!=null?sec:'?')+' s';
  if(t==='r')return String(r!=null?r:'?');
  return (kg||0)+' × '+(r!=null?r:'?')}
function lastFor(id,beforeKey){const i=DMAP[beforeKey].idx;for(let j=i-1;j>=0;j--){const lg=LOGS[DAYS[j].key];if(!lg||!lg.ex)continue;
  for(const k in lg.ex){if(baseId(k)===id){const s=(lg.ex[k].sets||[]).filter(setFilled);if(s.length)return{key:DAYS[j].key,sets:lg.ex[k].sets}}}}return null}
// metric für Halteübungen: 'r' = Wiederholungen gesamt, 's' = Haltezeit gesamt
function seriesFor(id,metric){const e=EX[id];const out=[];
  DAYS.forEach(d=>{const lg=LOGS[d.key];if(!lg||!lg.ex)return;
    for(const k in lg.ex){if(baseId(k)!==id)continue;const x=lg.ex[k];
      if(e.t==='m'){const v=numv(x.min);if(v>0)out.push({key:d.key,v,n:1,txt:v+' min'});continue}
      const sets=(x.sets||[]).filter(s=>s&&numv(s[mainF(e.t)])>0);if(!sets.length)continue;
      const txt=sets.map(s=>setTxt(e.t,s)).join(' · ');
      if(e.t==='h'){const reps=sets.reduce((a,s)=>a+numv(s.r),0);const secs=sets.reduce((a,s)=>a+numv(s.r)*(numv(s.s)||0),0);
        out.push({key:d.key,v:metric==='s'?secs:reps,n:sets.length,reps,secs,txt})}
      else if(e.t==='t'){out.push({key:d.key,v:Math.max(...sets.map(s=>numv(s.s))),n:sets.length,txt})}
      else if(e.t==='r'){out.push({key:d.key,v:sets.reduce((a,s)=>a+numv(s.r),0),n:sets.length,txt})}
      else{const kgs=sets.map(s=>numv(s.kg)||0);const mx=Math.max(...kgs);
        const best=mx>0?sets[kgs.indexOf(mx)]:sets.reduce((a,b)=>numv(b.r)>numv(a.r)?b:a);
        out.push({key:d.key,v:mx>0?mx:numv(best.r),bw:!(mx>0),n:sets.length,txt})}}});
  return out}

function perfInfo(e,s){const bw=e.t==='w'&&s.every(p=>p.bw);
  if(e.t==='m')return{u:'min',d:'Minuten'};if(e.t==='t')return{u:'s',d:'Längster Satz'};

function barChart(rows,unit,aria){const W=640,H=180,L=38,R=12,T=22,Bt=28;const mx=niceMax(Math.max(1,...rows.map(r=>r.v)));
  const bw=(W-L-R)/rows.length;const y=v=>T+(H-T-Bt)*(1-v/mx);let g='';
  for(let i=0;i<=4;i++){const v=mx/4*i;const yy=y(v);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-8}" y="${yy+4}" text-anchor="end">${+v.toFixed(1)}</text>`}
  rows.forEach((r,i)=>{const x=L+i*bw+bw*.18,w=bw*.64,yy=y(r.v);
    g+=`<rect class="bar${r.cur?' cur':''}" x="${x}" y="${yy}" width="${w}" height="${Math.max(0,y(0)-yy)}" rx="4"><title>${esc(r.l)}: ${r.v} ${unit}</title></rect>`;
    if(r.v>0)g+=`<text class="lbl" x="${x+w/2}" y="${yy-6}" text-anchor="middle">${r.v}</text>`;
    g+=`<text class="ax" x="${x+w/2}" y="${H-8}" text-anchor="middle">${esc(r.l)}</text>`});
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}">${g}</svg></div>`}
function niceMax(v){if(!(v>0))return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));for(const m of [1,1.5,2,2.5,3,4,5,6,8,10])if(m*p>=v*1.12)return m*p;return 10*p}
function chart(pts,o){o=o||{};const W=640,H=220,L=38,R=22,T=20,Bt=30;
  const yMax=o.yMax!=null?o.yMax:niceMax(Math.max(...pts.map(p=>p.v)));const yMin=0;
  const x=i=>pts.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(pts.length-1);
  const y=v=>T+(H-T-Bt)*(1-(v-yMin)/(yMax-yMin));
  let g='';const tick=yMax/4;for(let i=0;i<=4;i++){const v=tick*i;const yy=y(v);g+=`<line class="grid" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-8}" y="${yy+4}" text-anchor="end">${+v.toFixed(1)}</text>`}
  if(o.limit!=null){const yy=y(o.limit);g+=`<line class="lim" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="liml" x="${W-R}" y="${yy-6}" text-anchor="end">Grenze ${o.limit}</text>`}
  const step=Math.max(1,Math.ceil(pts.length/6));pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1){if(i!==pts.length-1&&pts.length-1-i<step*0.6)return;g+=`<text class="ax" x="${x(i)}" y="${H-8}" text-anchor="middle">${short(p.key).slice(3)}</text>`}});
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.v).toFixed(1)).join(' ');
  const area=pts.length>1?`<path class="ar" d="${path} L${x(pts.length-1)} ${y(0)} L${x(0)} ${y(0)} Z"/>`:'';
  const dots=pts.map((p,i)=>`<circle class="pt${i===pts.length-1?' end':''}" cx="${x(i)}" cy="${y(p.v)}" r="${i===pts.length-1?5:3.5}"><title>${short(p.key)}: ${esc(p.txt||p.v)}</title></circle>`).join('');
  const lp=pts[pts.length-1];const lx=x(pts.length-1),ly=y(lp.v);
  const lbl=`<text class="lbl" x="${Math.min(lx,W-R)}" y="${Math.max(ly-12,12)}" text-anchor="${pts.length===1?'middle':'end'}">${esc(o.fmt?o.fmt(lp):lp.v)}</text>`;
  return `<div class="chartbox"><svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria||'Verlauf')}">${g}${area}<path class="ln" d="${path}"/>${dots}${lbl}</svg></div>`}
function viewProgress(){const tk=todayKey();
  const past=DAYS.filter(d=>d.key<=tk&&isWorkout(d));const done=past.filter(d=>getLog(d.key).status==='ja').length;
  const n=Math.round((new Date(2026,11,28)-dateOf(tk))/864e5);
  const last7=DAYS.filter(d=>d.key<=tk&&d.idx>=(DMAP[tk]?DMAP[tk].idx:DAYS.length)-6).map(d=>getLog(d.key).pain).filter(v=>v!=null);
  const avg=last7.length?(last7.reduce((a,b)=>a+b,0)/last7.length).toFixed(1).replace('.',','):'–';
  const tiles=`<div class="tiles">
    <div class="card tile"><div class="v">${done}<span class="muted" style="font-size:.55em;font-weight:700"> / ${past.length||0}</span></div><div class="l">Trainingstage erledigt${past.length?'':' (Start 22.11.)'}</div></div>
    <div class="card tile"><div class="v">${Math.max(n,0)}</div><div class="l">Tage bis Tennis</div></div>
    <div class="card tile"><div class="v">${avg}</div><div class="l">Ø Schmerz, letzte 7 Tage</div></div></div>`;
  const calCard=calendar(null);
  // Schmerz
  const pp=DAYS.filter(d=>getLog(d.key).pain!=null).map(d=>({key:d.key,v:getLog(d.key).pain,txt:getLog(d.key).pain+'/10'}));
  const painCard=`<section class="card pad sec"><h2>Schmerzverlauf</h2>${pp.length?chart(pp,{yMax:10,limit:3,aria:'Schmerz pro Tag, Skala 0 bis 10',fmt:p=>p.v+'/10'}):'<div class="empty">Noch keine Werte. Trag auf der Tagesseite deinen Schmerz von 0 bis 10 ein.</div>'}</section>`;
  // Fortschritt nach Trainingsfokus
  const has=f=>f.ex.some(id=>seriesFor(id,'r').length);
  if(!selFocus)selFocus=(FOCUS.find(has)||FOCUS[0]).id;
  const F=FOCUS.find(f=>f.id===selFocus)||FOCUS[0];
  const tabs=`<div class="ftabs" role="group" aria-label="Trainingsfokus">${FOCUS.map(f=>`<button class="ftab${has(f)?' has':''}" data-act="focus" data-v="${f.id}" aria-pressed="${f.id===F.id}">${esc(f.n)}</button>`).join('')}</div>`;
  const isEndu=F.id==='endu';
  const curW=(DMAP[tk]||DAYS[0]).week;
  const weekRows=[1,2,3,4,5].map(wn=>{let v=0;DAYS.filter(d=>d.week===wn||(wn===5&&d.week===6)).forEach(d=>{const lg=LOGS[d.key];if(!lg||!lg.ex)return;
      for(const k in lg.ex){const id=baseId(k);if(!F.ex.includes(id))continue;const e=EX[id];const x=lg.ex[k];
        if(e.t==='m')v+=numv(x.min)||0;else v+=(x.sets||[]).filter(q=>q&&numv(q[mainF(e.t)])>0).length}});
    return{l:'Woche '+wn,v,cur:wn===Math.min(curW,5)}});
  const exCards=F.ex.map(id=>{const e=EX[id];const s=seriesFor(id,'r');
    if(!s.length)return `<div class="fx"><div class="fxh"><b>${esc(e.n)}</b><span class="muted">noch keine Einträge</span></div></div>`;
    const pi=perfInfo(e,s);const useSets=selMetric==='sets'&&e.t!=='m';
    const pts=s.map(p=>useSets?Object.assign({},p,{v:p.n}):p);const unit=useSets?'Sätze':pi.u;
    const f0=s[0],fl=s[s.length-1];const dv=s.length>1?+(fl.v-f0.v).toFixed(1):0;const dn=s.length>1?fl.n-f0.n:0;
    const sum=[`${pi.d}: <b>${fl.v} ${pi.u}</b>${s.length>1?` (${dv>=0?'+':''}${dv} seit ${short(f0.key)})`:''}`];
    if(e.t!=='m')sum.push(`Sätze: <b>${fl.n}</b>${dn!==0?` (${dn>0?'+':''}${dn})`:''}`);
    return `<div class="fx"><div class="fxh"><b>${esc(e.n)}</b><span class="muted num">${s.length} ${s.length===1?'Einheit':'Einheiten'}</span></div>
      <div class="fxs">${sum.join(' · ')}</div>
      ${chart(pts,{aria:e.n+' Verlauf in '+unit,fmt:p=>p.v+' '+unit})}
      <details><summary>Alle Einträge</summary><table class="hist"><tbody>${s.slice().reverse().map(p=>`<tr><td>${short(p.key)}</td><td>${e.t==='m'?'':p.n+' Sätze: '}${esc(p.txt)}</td></tr>`).join('')}</tbody></table></details></div>`}).join('');
  const toggle=isEndu?'':`<div class="yn" role="group" aria-label="Kennzahl pro Übung"><button data-act="metric" data-v="perf" aria-pressed="${selMetric!=='sets'}">Leistung</button><button data-act="metric" data-v="sets" aria-pressed="${selMetric==='sets'}">Sätze</button></div>`;
  const exCard=`<section class="card pad sec"><h2>Fortschritt nach Trainingsfokus</h2>${tabs}
    <div class="fhead"><b>${esc(F.n)}</b><span class="muted">${esc(F.d)}</span></div>
    <div class="muted" style="font-size:14px">${isEndu?'Minuten pro Woche, alle Einheiten zusammen.':'Sätze pro Woche, alle Übungen dieses Fokus zusammen. So bleibt der Vergleich fair, auch wenn die Übung wechselt.'}</div>
    ${weekRows.some(r=>r.v>0)?barChart(weekRows,isEndu?'min':'Sätze',F.n+' pro Woche'):'<div class="empty">Noch keine Einträge in diesem Fokus. Sobald du Sätze einträgst, siehst du hier deine Wochen.</div>'}
    ${toggle}
    <div class="fxlist">${exCards}</div></section>`;
  return `<div class="dhead"><div class="eyebrow">Bis heute</div><h1>Fortschritt</h1></div>${tiles}${calCard}${painCard}${exCard}`}

/* ---------- Ansicht: Regeln ---------- */
function viewRules(){return `<div class="dhead"><div class="eyebrow">Gilt die ganzen 5 Wochen</div><h1>Regeln</h1></div>
  <section class="card pad rules alert"><h2>Zum Arzt oder Physio, wenn …</h2><ul>
    <li>der Schmerz ins Bein ausstrahlt, oder du Taubheit, Kribbeln oder Schwäche im Bein hast.</li>
    <li>du Probleme mit Blase oder Darm hast. <b>Dann sofort.</b></li>
    <li>du Nachtschmerz hast, der nicht von der Position abhängt, oder Fieber.</li>
    <li>es nach 2 bis 3 Wochen nicht spürbar besser wird.</li>
    <li>es auch im Hohlkreuz wehtut, zum Beispiel beim Aufschlag. Das kann eine Stressreaktion am Wirbelbogen sein (Spondylolyse).</li>
    <li>die Pallof Press dieselben Schmerzen auslöst wie die Vorhand.</li></ul></section>
  <section class="card pad rules"><h2>Schmerz-Ampel</h2><p>Bis 3 von 10 beim Training ist okay, wenn der Schmerz am nächsten Morgen wieder auf dem normalen Niveau ist. Ist er das nicht, gehst du einen Schritt zurück.</p>
    <p class="muted" style="font-size:14px">Eine neue Woche startest du nur, wenn die vorherige weitgehend schmerzfrei lief. Sonst wiederholst du sie.</p></section>
  <section class="card pad rules"><h2>Jeden Tag</h2><ul>
    <li><b>Morgens schonen:</b> In der ersten Stunde nach dem Aufstehen kein Vorbeugen und kein Dehnen Richtung Zehen.</li>
    <li><b>Viel gehen:</b> 2 bis 3 Mal am Tag 10 bis 20 Minuten zügig.</li>
    <li><b>Wenig sitzen:</b> Nicht länger als 30 bis 40 Minuten am Stück.</li>
    <li><b>Core immer zuhause:</b> nur Widerstandsband, Körpergewicht und die Hantel für Around the World.</li>
    <li><b>Sauber geht vor lang:</b> Curl-up, Seitstütz, Glute Bridge und Copenhagen hältst du am Stück. Bird Dog und Pallof Press machst du als Wiederholungen mit kurzem Halten. Wackelt die Form, beendest du den Satz.</li>
    <li><b>Gewicht im Gym:</b> Am Ende sollten noch 2 bis 3 Wiederholungen im Tank sein.</li></ul></section>
  <section class="card pad rules"><h2>Vorerst weglassen</h2><ul>
    <li>Tennis bis zum Mini-Tennis am 26.12.</li>
    <li>Crunches, Russian Twists, Woodchopper und Rumpfdrehungen mit Gewicht. Rotation kommt erst in Woche 4, aus der Hüfte.</li>
    <li>Kreuzheben in jeder Form.</li>
    <li>Vorgebeugtes Langhantelrudern, Kabelrudern mit Vorlehnen, Dips, Überkopfübungen im Stehen.</li></ul></section>
  <section class="card pad rules"><h2>Massagepistole</h2><ul>
    <li>Nur auf die Rückenstrecker links und rechts neben der Wirbelsäule, nie auf die Knochen in der Mitte.</li>
    <li>Nierengegend seitlich unter den Rippen aussparen.</li>
    <li>Niedrige bis mittlere Stufe, weicher Aufsatz, 1 bis 2 Minuten pro Seite, eher gleiten als drücken.</li>
    <li>Gesäß und hintere Hüfte lohnen sich oft mehr als der Rücken selbst.</li>
    <li>Wird der Schmerz danach stärker oder strahlt aus: aufhören.</li></ul></section>`}

/* ---------- Render ---------- */
let lastView=null;
function render(){const r=route();renderNav(r.v);renderCountdown();main.classList.toggle('wide',r.v==='heute');
  main.innerHTML=r.v==='heute'?viewDay(r.day):r.v==='plan'?viewPlan():r.v==='fortschritt'?viewProgress():viewRules();
  const sig=r.v+(r.day||'');if(lastView!==null&&lastView!==sig){window.scrollTo(0,0)}lastView=sig}
window.addEventListener('hashchange',()=>{CUR=location.hash.slice(1);render();main.focus({preventScroll:true})});

/* ---------- Interaktion ---------- */
function curDay(){const r=route();return r.v==='heute'?r.day:null}
function refreshEx(dk,k){const el=main.querySelector(`.ex[data-ex="${CSS.escape(k)}"]`);if(!el)return;
  const day=DMAP[dk];const lg=getLog(dk);let item=null,bi=-1;day.items.forEach((arr,i)=>arr.forEach(it=>{if(it.k===k){item=it;bi=i}}));
  const d=exDone(EX[item.id],lg.ex[k]);el.classList.toggle('is-done',d);el.querySelector('.chk').setAttribute('aria-pressed',d);
  const n=day.items[bi].filter(it=>exDone(EX[it.id],lg.ex[it.k])).length;const bp=main.querySelector(`[data-bprog="${bi}"]`);const all=n===day.items[bi].length;if(bp)bp.textContent=all?'Geschafft':n+'/'+day.items[bi].length;
  const sec=main.querySelector(`[data-block="${bi}"]`);if(sec)sec.classList.toggle('complete',all)}
main.addEventListener('click',ev=>{const b=ev.target.closest('[data-act]');if(!b||b.disabled)return;const a=b.dataset.act;
  if(a==='goto'){if(b.dataset.day)go('tag-'+b.dataset.day);return}
  if(a==='metric'){selMetric=b.dataset.v;render();return}
  if(a==='focus'){selFocus=b.dataset.v;render();return}
  const dk=curDay();if(!dk)return;const lg=ensureLog(dk);
  if(a==='lock'){lg.locked=!lg.locked;if(!lg.locked)delete lg.locked;touch(dk);render();const lb=main.querySelector('[data-act="lock"]');if(lb)lb.focus({preventScroll:true});return}
  if(lg.locked)return;
  if(a==='status'){lg.status=lg.status===b.dataset.v?null:b.dataset.v;touch(dk);render()}
  else if(a==='pain'){const v=+b.dataset.v;lg.pain=lg.pain===v?null:v;touch(dk);render()}
  else if(a==='toggle'){const k=b.dataset.k;const it=DMAP[dk].items.flat().find(x=>x.k===k);const x=lg.ex[k]||(lg.ex[k]={});x.done=!exDone(EX[it.id],x);touch(dk);refreshEx(dk,k)}
  else if(a==='addset'||a==='delset'){const k=b.dataset.k;const it=DMAP[dk].items.flat().find(x=>x.k===k);const x=lg.ex[k]||(lg.ex[k]={});const cur=x.n||setsCount(it);
    x.n=a==='addset'?Math.min(10,cur+1):Math.max(1,cur-1);if(x.sets)x.sets=x.sets.slice(0,x.n);if(x.n===setsCount(it))delete x.n;touch(dk);render();
    const nb=main.querySelector(`[data-act="${a}"][data-k="${CSS.escape(k)}"]`);if(nb&&!nb.disabled)nb.focus({preventScroll:true})}
  else if(a==='copy'){const k=b.dataset.k;const last=lastFor(b.dataset.id,dk);if(!last)return;const x=lg.ex[k]||(lg.ex[k]={});x.sets=last.sets.map(s=>Object.assign({},s||{}));const it=DMAP[dk].items.flat().find(q=>q.k===k);if(x.sets.length!==setsCount(it))x.n=x.sets.length;else delete x.n;touch(dk);render()}
});
main.addEventListener('input',ev=>{const t=ev.target;const f=t.dataset&&t.dataset.f;if(!f||f==='exsel')return;const dk=curDay();if(!dk)return;const lg=ensureLog(dk);if(lg.locked)return;
  if(f==='note'){lg.note=t.value.slice(0,4000);touch(dk);return}
  const k=t.dataset.k;const x=lg.ex[k]||(lg.ex[k]={});
  if(f==='min'){x.min=t.value.replace(/[^\d.,]/g,'').slice(0,5)}
  else{x.sets=x.sets||[];const i=+t.dataset.i;x.sets[i]=x.sets[i]||{};x.sets[i][f]=t.value.replace(/[^\d.,]/g,'').slice(0,6);for(let j=0;j<x.sets.length;j++)if(!x.sets[j])x.sets[j]={}}
  touch(dk);refreshEx(dk,k)});

render();
initDb();
</script>
